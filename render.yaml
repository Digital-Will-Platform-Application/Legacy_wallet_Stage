services:
  # Backend API Service
  - type: web
    name: legacy-wallet-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Add your environment variables here
      # DATABASE_URL, JWT_SECRET, etc. should be set in Render dashboard

  # Frontend Web Service
  - type: web
    name: legacy-wallet-frontend
    env: static
    buildCommand: cd Legacy_wallet-main && npm install && npm run build
    staticPublishPath: Legacy_wallet-main/dist
    envVars:
      - key: NODE_ENV
        value: production
